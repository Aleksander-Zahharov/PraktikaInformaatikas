name: Deploy presentation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["Prezentatsioon/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site from Prezentatsioon/
        run: |
          mkdir _site
          cp -r Prezentatsioon/. _site/
          rm -rf _site/img/raw _site/*.mjs
          cp _site/slides_ru.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
